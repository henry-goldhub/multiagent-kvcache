[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kvbridge"
version = "0.1.0"
description = "KV-cache reuse and experimental cross-model adaptation for multi-step LLM pipelines."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "transformers>=4.45",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
eval = ["datasets>=2.20"]

[tool.setuptools.packages.find]
include = ["kvbridge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
